# import User from 'user.graphql'
# import Post from 'post.graphql'
# import InterviewBookingEffect, InterviewSlotInput from 'interview.graphql'

scalar Date
scalar DateTime
"""
Queries and mutations that relies on an election being open
does not take an `electionId` parameter.
"""

type Query {
  openElection: [Election!]!
  latestElections(limit: Int, includeUnopened: Boolean, includeHiddenNominations: Boolean): [Election!]!
  election(electionId: Int!): Election!
  elections(electionIds: [Int!]!): [Election!]!

  """
  Used if nominations are hidden but an election-admin wants too see nominations
  """
  hiddenNominations(electionId: Int!, answer: NominationAnswer): [Nomination!]!

  "A users own nominations should always be available to them"
  myNominations(electionId: Int!, answer: NominationAnswer): [Nomination!]!
  numberOfNominations(electionId: Int!, postId: Int): Int!
  numberOfProposals(electionId: Int!, postId: Int): Int!

  "Valberedningens work per post: proposals, candidates and motkandidering. Election admins only"
  proposalOverview(electionId: Int!): [ProposalPostOverview!]!

  "The user's own proposals (sent ones only) and motkandidat options in an election"
  myProposals(electionId: Int!): [Proposal!]!
  myCounterCandidacies(electionId: Int!): [CounterCandidacyOption!]!
}

type Mutation {
  createElection(electables: [Int!]!, nominationsHidden: Boolean!): Election!
  addElectables(electionId: Int!, postIds: [Int!]!): Boolean!
  removeElectables(electionId: Int!, postIds: [Int!]!): Boolean!
  setElectables(electionId: Int!, postIds: [Int!]!): Boolean!
  setHiddenNominations(electionId: Int!, hidden: Boolean!): Boolean!
  openElection(electionId: Int!): Boolean!
  closeElection(electionId: Int!): Boolean!

  "Only possible during open election, so electionId is known"
  nominate(username: String!, postIds: [Int!]!): Boolean!

  """
  Only possible during open election, so electionId is known.
  If the answer affects an interview booking, `expectedEffect` must be the effect
  from `nominationResponsePreview`, otherwise nothing is changed. `rebook` books a
  new time in the same step when the booking is removed.
  """
  respondToNomination(
    postId: Int!
    accepts: NominationAnswer!
    expectedEffect: InterviewBookingEffect
    rebook: InterviewSlotInput
  ): Boolean!
  "Adds a draft proposal. The user must be a candidate (accepted nomination) for the post"
  propose(electionId: Int!, username: String!, postId: Int!): Boolean!
  """
  Deletes a draft. A sent or accepted proposal is withdrawn instead, and the person is
  mailed if the deadline has not passed
  """
  removeProposal(electionId: Int!, username: String!, postId: Int!): Boolean!
  "Sends all draft proposals for a post and mails the proposed. Returns how many were sent"
  sendProposals(electionId: Int!, postId: Int!): Int!
  "Accepts or declines the user's own pending proposal"
  respondToProposal(electionId: Int!, postId: Int!, accepts: Boolean!): Boolean!
  "Opens motkandidering for a post and mails candidates who were never proposed"
  openCounterCandidacy(electionId: Int!, postId: Int!): Boolean!
  "The user's own answer to running as motkandidat"
  respondToCounterCandidacy(electionId: Int!, postId: Int!, accepts: Boolean!): Boolean!
  "Sets the deadline for proposals and motkandidering"
  setProposalDeadline(electionId: Int!, deadline: DateTime!): Boolean!
  "Manual admin change, at any time and without mail"
  setProposalStatus(
    electionId: Int!
    username: String!
    postId: Int!
    status: ProposalStatus!
  ): Boolean!
  "Manual admin change, at any time and without mail. `answer: null` removes the answer"
  setCounterCandidacy(
    electionId: Int!
    username: String!
    postId: Int!
    answer: Boolean
  ): Boolean!
  renameElection(electionId: Int!, name: String): Boolean!
}

type Election {
  id: Int!
  name: String!
  creator: User!
  createdAt: Date!
  openedAt: Date
  closedAt: Date
  open: Boolean!

  "Which posts can be elected in the election"
  electables: [Post!]!
  "Only for election admins; empty for everyone else"
  proposals: [Proposal]

  "Is only available if `nominationsHidden` is `false`"
  acceptedNominations: [Nomination!]!

  "Whether accepted nominations are to be hidden"
  nominationsHidden: Boolean!

  "After it, proposals and motkandidering are locked for members"
  proposalDeadline: DateTime
}

"""
Valberedningens förslag. Members only see their own, through `myProposals`.
A PENDING proposal past the deadline is reported as DECLINED
"""
type Proposal {
  user: User!
  post: Post!
  status: ProposalStatus!
  sentAt: DateTime
  answeredAt: DateTime
  "Was still pending when the deadline passed"
  expired: Boolean!
}

enum ProposalStatus {
  DRAFT
  PENDING
  ACCEPTED
  DECLINED
  WITHDRAWN
}

type ProposalPostOverview {
  post: Post!
  proposals: [Proposal!]!
  "Candidates (accepted nominations) for the post"
  candidates: [User!]!
  acceptedCount: Int!
  counterCandidacyOpenedAt: DateTime
  "Whether motkandidering can be opened now"
  canOpenCounterCandidacy: Boolean!
  counterCandidacies: [CounterCandidacy!]!
}

type CounterCandidacy {
  user: User!
  post: Post!
  "YES or NO"
  answer: NominationAnswer!
  answeredAt: DateTime!
}

type CounterCandidacyOption {
  post: Post!
  "NOT_ANSWERED until the user has answered"
  answer: NominationAnswer!
  "Whether the user can answer or change their answer now"
  canRespond: Boolean!
}

type Nomination {
  user: User!
  post: Post!
  answer: NominationAnswer!
  electionName: String!
}

enum NominationAnswer {
  YES
  NO
  NOT_ANSWERED
}
