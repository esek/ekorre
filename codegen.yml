overwrite: true
documents: null
generates:
  src/models/generated/graphql.ts:
    config:
      useIndexSignature: true
      useTypeImports: true
      contextType: ../context#Context
      skipTypename: true
      scalars:
        Object: Record<string, string>
        Date: Date
        DateTime: Date
      mappers:
        Article: ../mappers#ArticleResponse
        File: ../mappers#FileResponse
        Meeting: ../mappers#MeetingResponse
        Election: ../mappers#ElectionResponse
        Proposal: ../mappers#ProposalResponse
        Nomination: ../mappers#NominationResponse
        Hehe: ../mappers#HeheResponse
        AccessLogPost: ../mappers#AccessLogPostResponse
        AccessLogIndividualAccess: ../mappers#AccessLogIndividualAccessResponse
        ApiKey: ../mappers#ApiKeyResponse
        InterviewSettings: ../mappers#InterviewSettingsResponse
        InterviewPostDuration: ../mappers#InterviewPostDurationResponse
        InterviewWindow: ../mappers#InterviewWindowResponse
        InterviewBooking: ../mappers#InterviewBookingResponse
        InterviewRequest: ../mappers#InterviewRequestResponse
        InterviewNominee: ../mappers#InterviewNomineeResponse
    schema: "./src/schemas/*.graphql"
    plugins:
      - "typescript"
      - "typescript-resolvers"
